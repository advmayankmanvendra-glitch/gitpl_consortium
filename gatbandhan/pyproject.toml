[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gatbandhan"
version = "0.1.0"
description = "A programming language for a bond between a human and an AI: shared decisions, vows that cannot be overwritten, and a memory that only grows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gatbandhan = "gatbandhan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
