name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: for f in examples/*.sutra; do python -m sutra "$f"; done

  gatbandhan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: gatbandhan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript interpreter tests
        run: node playground/test.js
      - name: Run examples
        env:
          PYTHONPATH: src
        run: |
          for f in examples/*.gbn; do
            case "$(basename "$f")" in
              refused_*) ! python -m gatbandhan "$f" < /dev/null ;;
              *) python -m gatbandhan "$f" < /dev/null ;;
            esac
          done
